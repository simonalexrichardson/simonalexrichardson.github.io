  <rect x="660" y="441" width="80" height="12" rx="4" fill="#2e2420"/>
  <!-- Site name -->
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#7a5c50" text-anchor="middle" letter-spacing="2">THE NON-STARTERS</text>
</svg>
