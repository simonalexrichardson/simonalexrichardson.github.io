  <circle cx="42" cy="18" r="6" fill="#2e2420"/>
  <circle cx="62" cy="18" r="6" fill="#2e2420"/>
  <rect x="86" y="10" width="500" height="16" rx="8" fill="#261e1a"/>
  <!-- Hero section -->
  <rect x="0" y="36" width="800" height="230" fill="#16120f"/>
  <!-- Band name large -->
  <rect x="140" y="100" width="520" height="36" rx="4" fill="#2e2420"/>
  <rect x="200" y="152" width="400" height="18" rx="4" fill="#261e1a"/>
  <!-- Record/vinyl icon -->
  <circle cx="400" cy="310" r="70" fill="#261e1a"/>
  <circle cx="400" cy="310" r="46" fill="#1c1714"/>
  <circle cx="400" cy="310" r="24" fill="#2e2420"/>
  <circle cx="400" cy="310" r="8" fill="#c0392b"/>
