  <circle cx="400" cy="310" r="38" stroke="#2a1f1b" stroke-width="1" fill="none"/>
  <circle cx="400" cy="310" r="55" stroke="#2a1f1b" stroke-width="1" fill="none"/>
  <circle cx="400" cy="310" r="65" stroke="#2a1f1b" stroke-width="1" fill="none"/>
